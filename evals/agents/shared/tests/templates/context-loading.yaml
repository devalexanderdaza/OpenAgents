# Template: Context Loading
# Use this to test that agent loads context before answering
# Tests the context-loading evaluator

id: my-context-test
name: "My Context Loading Test"
description: |
  Describe what this test validates.
category: developer

prompts:
  - text: |
      What are the coding standards for this project? Read core/standards/code-quality.md first.

approvalStrategy:
  type: auto-approve

behavior:
  mustUseAnyOf:
    - [read]
    - [glob, read]
  minToolCalls: 1
  requiresContext: true
  # Canonical context filenames used by evaluator auto-mapping:
  # - code-quality.md
  # - documentation.md
  # - test-coverage.md
  # - code-review.md
  # - task-delegation-basics.md

expectedViolations:
  - rule: context-loading
    shouldViolate: false
    severity: error
  - rule: approval-gate
    shouldViolate: false
    severity: error

timeout: 90000

tags:
  - context-loading
  - read-only
